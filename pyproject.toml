[tool.poetry]
name = "NASA_exoplanet_analysis"
version = "1.0.0"
description = "Professional NASA exoplanet data analyzer with visualization"
authors = ["Anastasia Iva <Vatson.1604@gmail.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/Anastasia-0-Iva/NASA_exoplanet_analysis"
repository = "https://github.com/Anastasia-0-Iva/NASA_exoplanet_analysis"
keywords = ["nasa", "exoplanet", "astronomy", "data-science", "visualization"]

[tool.poetry.dependencies]
python = "^3.8"
pandas = "^1.3.0"
requests = "^2.26.0"
matplotlib = "^3.5.0"
numpy = "^1.21.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^22.0.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
